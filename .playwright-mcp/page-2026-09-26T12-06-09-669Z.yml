        - generic [ref=f57e109]: The story
        - 'heading "Most brand sites make you wait. Nocturne asked the opposite question: can a page feel cinematic and still be gone before you notice it loading?" [level=2] [ref=f57e112]'
      - generic [ref=f57e113]:
        - paragraph [ref=f57e115]: We built the entire experience around a single continuous camera move, then broke it into chapters that stream in as the scroll progresses. Everything above the fold renders in one frame group; the rest defers until the scroll position demands it.
        - paragraph [ref=f57e117]: The type system is the interface. Headlines compress and stretch with scroll velocity, and the soundscape reacts to chapter changes. Motion is the navigation — there are no buttons until you stop moving.
        - paragraph [ref=f57e119]: The hardest part was restraint. Every shader we added pushed frame time up, so we budgeted milliseconds instead of features and cut everything that did not serve the cut.
