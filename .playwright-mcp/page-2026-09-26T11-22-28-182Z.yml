        - generic [ref=f38e90]: The story
        - heading "Storefronts die in the gap between a merchandiser's idea and an engineer's deploy. Carmine Commerce closes that gap." [level=2] [ref=f38e93]
      - generic [ref=f38e94]:
        - paragraph [ref=f38e96]: We modelled content, catalogue and commerce as three separate graphs so merchandisers can rework a landing page without touching the product pipeline. Layouts are defined as schema, not code.
        - paragraph [ref=f38e98]: Navigation uses speculative prefetching on pointer-hover and viewport intersection, so category pages often appear before the click resolves. Cache invalidation is scoped to the exact route subtree that changed.
        - paragraph [ref=f38e100]: Checkout stayed deliberately boring. Every novelty we removed from the flow measurably improved completion, so the interesting work went into everything around it instead.
