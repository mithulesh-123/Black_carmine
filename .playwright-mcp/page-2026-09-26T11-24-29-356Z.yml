        - generic [ref=f41e93]: The story
        - heading "Field crews do not care that the server is far away. Meridian makes the offline path the primary path, not the fallback." [level=2] [ref=f41e96]
      - generic [ref=f41e97]:
        - paragraph [ref=f41e99]: Every mutation writes to a local queue with conflict-free merge semantics. The UI optimistically reflects the change, and a subtle indicator shows what is pending versus confirmed.
        - paragraph [ref=f41e101]: Sync is a background citizen. It batch-writes on restored connectivity, respects battery state, and never blocks the foreground interaction the user actually came for.
        - paragraph [ref=f41e103]: We designed the empty, error and mid-sync states first. On unreliable networks those are the states people live in, so they got the majority of the design effort.
